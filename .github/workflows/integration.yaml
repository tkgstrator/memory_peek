name: integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test host protocol and audit logic
        run: make test

      - name: Build and audit Switch package
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 \
            make -B switch

      - name: Prepare checked release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/switch/memory_peek.nsp dist/memory_peek.nsp
          cd dist
          sha256sum memory_peek.nsp > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Upload checked package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-peek-package
          path: |
            dist/memory_peek.nsp
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
