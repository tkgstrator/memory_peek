name: deployment

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release tag on master
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must have the form vX.Y.Z"
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/master; then
            echo "::error::The release commit is not on master"
            exit 1
          fi

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test host protocol and audit logic
        run: make test

      - name: Build and audit Switch package
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 \
            make -B switch

      - name: Prepare checked release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/switch/memory_peek.nsp dist/memory_peek.nsp
          cd dist
          sha256sum memory_peek.nsp > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Upload checked package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-peek-package
          path: |
            dist/memory_peek.nsp
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download checked package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: memory-peek-package
          path: dist

      - name: Verify downloaded package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict SHA256SUMS

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/memory_peek.nsp dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
